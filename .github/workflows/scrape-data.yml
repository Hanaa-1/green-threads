name: Daily Sustainability Data Scraper

on:
  schedule:
    # Runs every day at 3:00 AM UTC
    - cron: '0 3 * * *'
  # Allows you to run it manually from the GitHub website
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          cd scraper
          pip install requests beautifulsoup4 playwright
          playwright install chromium
      
      - name: Run scraper
        run: |
          cd scraper
          python scraper.py
      
      - name: Commit and push updated data
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add GreenThreadsAPI/wwwroot/data.json scraper/sustainability_data.db
          git commit -m "Auto-update sustainability data [skip ci]" || echo "No changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}